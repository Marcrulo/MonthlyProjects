---
layout: default
---

<ul>
    {% for post in paginator.posts %}
      <li>
          <h2 class="page_title"><a href="{{ post.url | prepend: site.baseurl | replace: '//', '/' }}">{{ post.title }}</a></h2>
          <time datetime="{{ post.date | date_to_xmlschema }}">
              {{ post.date | date: "%B %Y" }} 
              {% assign month_name = post.date | date: "%B" %}
              {{ site.data.month_emoji[month_name] }}
          </time>
          <p>{{ post.description }}</p>
          <img style='max-height:300px' src="{{ site.baseurl }}/assets/images/{{ post.image }}" alt="{{ post.title }}"/>        
          <p></p>

        </li>
    {% endfor %}
</ul>
