    // Make the hand-written `[](#slug)` in each heading the real, working
    // anchor id, and turn that empty link into a clickable "#" permalink.
    document.addEventListener('DOMContentLoaded', function () {
      var content = document.getElementById('main_content');
      if (!content) return;
      content.querySelectorAll('h2, h3, h4, h5, h6').forEach(function (h) {
        var link = h.querySelector('a[href^="#"]');
        if (!link) return;
        var slug = link.getAttribute('href').slice(1);
        if (slug) {
          h.id = slug;                          // custom slug wins over kramdown's auto id
        } else {
          link.setAttribute('href', '#' + h.id); // no slug written: fall back to auto id
        }
        link.setAttribute('aria-label', 'Link to this section');
      });
      // Deep links (e.g. .../post#website) are resolved by the browser before
      // the ids above exist, so re-scroll once the target is now present.
      if (location.hash) {

        if (target) target.scrollIntoView();

    });
